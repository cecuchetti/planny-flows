name: Python Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install uv

      - run: uv sync

      - run: uv run ruff check packages/

      - run: uv run mypy packages/

      - run: uv run pytest packages/ --cov

      - run: uv run alembic check
