repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        files: ^packages/
      - id: ruff-format
        files: ^packages/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        files: ^packages/
        args: [--strict]
        additional_dependencies:
          - pydantic>=2.0
          - sqlalchemy>=2.0
