services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jira
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5832:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - planny-network

  python-api:
    build:
      context: .
      dockerfile: Dockerfile.python
    ports:
      - "3824:3824"
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: jira_clone
      JWT_SECRET: jira-clone-dev-secret
      PORT: 3824
    depends_on:
      - db
    networks:
      - planny-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        API_URL: http://localhost:3824
    ports:
      - "8193:8193"
    depends_on:
      - python-api
    networks:
      - planny-network

volumes:
  postgres_data: {}

networks:
  planny-network:
    driver: bridge
