[project]
name = "planny-flows"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "planny-core",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-bleach>=6.4.0.20260607",
]

[tool.uv.sources]
planny-api = { workspace = true }
planny-jira = { workspace = true }
planny-core = { workspace = true }

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
